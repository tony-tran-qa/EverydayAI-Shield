name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt JavaScript actions into Node.js 24 (silences the Node 20 deprecation warning)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff pip-audit
          pip install pystray Pillow pywin32 --quiet

      - name: Lint (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 .

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Run tests
        run: pytest tests/ -v --tb=short
